name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GhostDeck.sln -p:Platform=x64

      - name: Build
        run: dotnet build GhostDeck.sln -c Release -p:Platform=x64 --no-restore

      - name: Publish application
        run: dotnet publish src/GhostDeck.App/GhostDeck.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/GhostDeck --no-restore

      - name: Publish service
        run: dotnet publish src/GhostDeck.Service/GhostDeck.Service.csproj -c Release -r win-x64 --self-contained true -o artifacts/GhostDeck --no-restore
